<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>极播 · 透明播出画面</title><style>
[hidden]{display:none!important}.scene-canvas,.scene-background{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.scene-canvas{z-index:1}.scene-background{z-index:0}.scene-title,.badge{z-index:2}.subtitle,.audio-enable,.output-note{z-index:3}.desktop-stage-bar{position:absolute;top:0;left:0;right:0;height:30px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 9px;color:#edf4f1;background:#254940d9;font-size:10px;-webkit-app-region:drag}.desktop-stage-bar button{-webkit-app-region:no-drag;background:none;border:0;color:white;font-size:20px;cursor:pointer}.desktop-stage-bar:hover{opacity:1}.desktop-stage-bar{opacity:.2;transition:opacity .2s}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.stage{position:relative;width:100%;height:100%;overflow:hidden}.scene-title{position:absolute;top:8%;left:9%;color:#536c6b;font-size:clamp(10px,2.8vw,24px);letter-spacing:.15em}.scene-title small{display:block;font-size:.55em;letter-spacing:.23em;color:#8da09c;margin-top:7px}.character-wrap{position:absolute;inset:12% 5% 7%;display:flex;align-items:center;justify-content:center}.character{height:100%;width:100%}.character img{height:100%;width:100%;object-fit:contain;display:block;user-select:none}.subtitle{position:absolute;bottom:7%;left:6%;right:6%;padding:14px 18px;background:#ffffffeb;border:1px solid #ffffffb0;border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #3c4a5b0b;color:#405650;font-size:clamp(12px,3vw,25px);line-height:1.7;transition:opacity .2s}.subtitle small{display:block;color:#8ba392;font-size:.65em;letter-spacing:.06em;margin-bottom:5px}.subtitle.hidden{opacity:0}.badge{position:absolute;top:5%;right:8%;padding:5px 10px;border:1px solid #ffffff90;border-radius:20px;color:#789186;font-size:clamp(8px,1.8vw,17px);background:#ffffff6b}.gift-effect{position:absolute;left:50%;top:35%;font-size:clamp(36px,9vw,90px);opacity:0;pointer-events:none}.thank .gift-effect{animation:spark 2.5s ease-out}.audio-enable{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);border:1px solid #dce6df;background:#fffffff2;border-radius:12px;padding:15px 22px;color:#4b7763;font-size:12px;cursor:pointer;box-shadow:0 6px 30px #0000000a;z-index:10}.audio-enable small{display:block;font-size:10px;color:#98a89f;margin-top:5px;max-width:230px}.output-note{position:absolute;left:12px;bottom:12px;color:#6b837b;background:#ffffffc9;border-radius:6px;font-size:10px;padding:6px 10px}.obs .scene-title{color:#dce7e1;text-shadow:0 1px 8px #0004}.obs .scene-title small{color:#dce7e1}@keyframes spark{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-80px) scale(1.2)}}
.character-videos{position:absolute;inset:0;z-index:1;pointer-events:none}.character-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.card-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}</style></head><body><div class="desktop-stage-bar" id="desktop-stage-bar" hidden><span>极播 · 播出窗口（拖动此处移动）</span><button id="close-stage" aria-label="关闭播出窗口">×</button></div><div class="stage" id="stage"><div class="scene-title" id="scene-title">好物，慢慢说。<small>YOUR EVERYDAY FINDS</small></div><span class="badge" id="scene-badge">场景模型预览</span><img id="card-background" class="card-background" alt="角色背景" hidden><div id="character-videos" class="character-videos" hidden></div><canvas id="scene-canvas" class="scene-canvas" hidden></canvas><div class="character-wrap" id="character-wrap"><div class="character" id="character"><img id="portrait" src="/static/avatar.svg" alt="虚拟主播"></div></div><div id="no-scene" class="output-note" hidden>请先在形象工坊生成模型，并在直播工作台选择该场景。</div><div class="gift-effect">✦</div><div class="subtitle hidden" id="subtitle"><small id="subtitle-label"></small><span id="subtitle-text"></span></div><button class="audio-enable" id="enable-audio">▶ 启用播出声音<small id="enable-hint">场景表情会跟随实际播放的声音。OBS 中可通过“交互”点击启用。</small></button><div class="output-note" id="output-note" hidden></div></div><script src="/static/scene-renderer.js"></script><script src="/static/action-player.js"></script><script src="/static/character-player.js"></script><script src="/static/stage.js"></script></body></html>
